<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仓库 VWAP</title>
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main>
      <h1>仓库 VWAP</h1>
      <form id="defaults">
        <div class="fields">
          <label>下调 %
            <input name="discount" type="number" min="0" max="100" step="0.01" inputmode="decimal" required>
          </label>
          <label>VWAP 天数
            <input name="days" type="number" min="1" step="1" inputmode="numeric" required>
          </label>
        </div>
        <div class="actions">
          <button>保存</button>
          <output role="status"></output>
          <a id="more" href="settings.html" target="_blank" rel="noopener">完整设置</a>
        </div>
      </form>
    </main>
  </body>
</html>
