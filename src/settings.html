<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-message="settingsTitle"></title>
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="settings.js"></script>
  </head>
  <body>
    <main>
      <header class="page-heading">
        <h1 data-message="title"></h1>
        <label class="language">
          <span data-message="language"></span>
          <select id="language" aria-describedby="language-notice">
            <option value="auto" data-message="browserLanguage"></option>
          </select>
        </label>
        <output id="language-notice" role="status"></output>
      </header>
      <section aria-labelledby="defaults-title">
        <h2 id="defaults-title" data-message="defaultQuote"></h2>
        <form id="defaults">
          <div class="fields">
            <label><span data-message="discount"></span>
              <input name="discount" type="number" min="0" max="100" step="0.01" inputmode="decimal" required>
            </label>
            <label><span data-message="periodDays"></span>
              <input name="days" type="number" min="1" step="1" inputmode="numeric" required
                aria-describedby="period-preview">
            </label>
          </div>
          <p id="period-preview" class="hint"></p>
          <details class="calculation">
            <summary data-message="howCalculated"></summary>
            <p class="hint" data-message="calculation"></p>
          </details>
          <div class="actions">
            <button data-message="save"></button>
            <output role="status"></output>
          </div>
        </form>
      </section>

      <section aria-labelledby="product-title">
        <h2 id="product-title" data-message="productsAndGrades"></h2>
        <form id="product-picker">
          <div class="picker">
            <input id="product-query" type="search" list="products" autocomplete="off" required
              data-placeholder="productQuery" data-label="productQuery">
            <button data-message="findProduct"></button>
          </div>
          <datalist id="products"></datalist>
          <output id="picker-notice" role="status"></output>
        </form>

        <form id="product-rules" hidden>
          <h3 id="product-name"></h3>
          <div class="fields" id="product-defaults">
            <label><span data-message="discount"></span>
              <input name="discount" type="number" min="0" max="100" step="0.01" inputmode="decimal">
            </label>
            <label><span data-message="periodDays"></span>
              <input name="days" type="number" min="1" step="1" inputmode="numeric" aria-describedby="inherit-rule">
            </label>
          </div>
          <p id="inherit-rule" class="hint" data-message="inherit"></p>
          <details id="quality-settings">
            <summary data-message="byQuality"></summary>
            <table>
              <thead>
                <tr>
                  <th scope="col" data-message="quality"></th>
                  <th scope="col" data-message="discount"></th>
                  <th scope="col" data-message="periodDays"></th>
                </tr>
              </thead>
              <tbody id="quality-rows"></tbody>
            </table>
          </details>
          <div class="actions">
            <button data-message="saveProduct"></button>
            <button type="reset" class="text-button" data-message="undo" hidden></button>
            <output role="status"></output>
          </div>
        </form>
      </section>

      <details class="advanced">
        <summary data-message="displayAndData"></summary>
        <form id="appearance">
          <div class="checks">
            <label><input name="autoFetch" type="checkbox"> <span data-message="autoFetch"></span></label>
            <label><input name="date" type="checkbox"> <span data-message="showDate"></span></label>
            <label><input name="chartLink" type="checkbox"> <span data-message="showChart"></span></label>
            <label><input name="overview" type="checkbox"> <span data-message="showOverview"></span></label>
            <label><input name="coverage" type="checkbox"> <span data-message="showCoverage"></span></label>
            <label><input name="localizedNumbers" type="checkbox"> <span data-message="localizedNumbers"></span></label>
          </div>
          <div class="fields">
            <label><span data-message="autoScope"></span>
              <select name="scope">
                <option value="stock" data-message="scopeStock"></option>
                <option value="detail" data-message="scopeDetail"></option>
              </select>
            </label>
            <label><span data-message="showPrices"></span>
              <select name="prices">
                <option value="both" data-message="bothPrices"></option>
                <option value="vwap" data-message="onlyVwap"></option>
                <option value="discounted" data-message="onlyDiscounted"></option>
              </select>
            </label>
            <label><span data-message="precision"></span>
              <select name="precision">
                <option value="auto" data-message="automatic"></option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
            <label><span data-message="layout"></span>
              <select name="layout">
                <option value="inline" data-message="inline"></option>
                <option value="stacked" data-message="stacked"></option>
              </select>
            </label>
            <label><span data-message="theme"></span>
              <select name="theme">
                <option value="system" data-message="systemTheme"></option>
                <option value="light" data-message="light"></option>
                <option value="dark" data-message="dark"></option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button data-message="save"></button>
            <output role="status"></output>
          </div>
        </form>
      </details>
    </main>

    <template id="quality-row">
      <tr>
        <th scope="row"></th>
        <td><input type="number" min="0" max="100" step="0.01" inputmode="decimal"></td>
        <td><input type="number" min="1" step="1" inputmode="numeric"></td>
      </tr>
    </template>
  </body>
</html>
