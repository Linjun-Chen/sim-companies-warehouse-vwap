<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-message="title"></title>
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main>
      <h1 data-message="title"></h1>
      <form id="defaults">
        <div class="fields">
          <label><span data-message="discount"></span>
            <input name="discount" type="number" min="0" max="100" step="0.01" inputmode="decimal" required>
          </label>
          <label><span data-message="periodDays"></span>
            <input name="days" type="number" min="1" step="1" inputmode="numeric" required
              aria-describedby="period-preview">
          </label>
        </div>
        <p id="period-preview" class="hint"></p>
        <div class="actions">
          <button data-message="save"></button>
          <output role="status"></output>
          <a id="more" href="settings.html" target="_blank" rel="noopener" data-message="moreSettings"></a>
        </div>
      </form>
    </main>
  </body>
</html>
